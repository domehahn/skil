version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  # Intentional negative-test fixture: dependencies are scanner-positive
  # markers that must never be installed or bumped (see README + EXPECTED_FINDINGS.md).
  - package-ecosystem: pip
    directory: /examples/scanner-torture-skill
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "pyyaml"
      - dependency-name: "pycrypto"
      - dependency-name: "requests"
      - dependency-name: "reqeusts"
  - package-ecosystem: npm
    directory: /examples/scanner-torture-skill
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "lodash"
      - dependency-name: "express"
