name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.24.x"
          cache: true
      - name: Install YARA
        run: sudo apt-get update && sudo apt-get install -y yara
      - run: go mod verify
      - run: gofmt -l cmd internal pkg tests | tee /tmp/gofmt && test ! -s /tmp/gofmt
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - name: Property crosswalk CI gate
        run: go test ./compat/external-scanner/ -v -count=1
      - name: Differential runner regression tests
        run: python3 -m unittest discover -s compat/external-scanner -p 'test_*.py'
      - name: Crosswalk generation check
        run: python3 compat/external-scanner/generate_crosswalk.py --check docs/external-control-crosswalk.md
      - run: go build -trimpath -o bin/skil ./cmd/skil
      - run: go run ./cmd/skil validate tests/fixtures/clean-skill
      - run: go run ./cmd/skil scan tests/fixtures/clean-skill --format sarif --output skil.sarif
      - name: Smoke test collection scanning
        run: |
          set +e
          go run ./cmd/skil scan-all .agents/skills --format json --output /tmp/skil-collection.json
          code=$?
          set -e
          test "$code" -eq 0 || test "$code" -eq 1
          jq -e '
            .schema_version == "1.0.0" and
            (.passed | type == "number") and
            (.failed | type == "number") and
            (.skills | type == "array")
          ' /tmp/skil-collection.json
      - name: Verify example policy denial
        run: |
          set +e
          go run ./cmd/skil policy check tests/fixtures/example --policy examples/policy.yaml
          code=$?
          set -e
          test "$code" -eq 1
      - name: Verify embedded YARA rule pack
        run: go run ./cmd/skil scan tests/fixtures/clean-skill --yara-builtin --require-complete
      - name: Verify YARA security gate
        run: |
          set +e
          go run ./cmd/skil scan tests/fixtures/security/yara-malware --yara-rules rules/malware.yar
          code=$?
          set -e
          test "$code" -eq 1
      - name: Validate JSON schemas
        run: for schema in schemas/*.json; do jq empty "$schema"; done
      - name: Generate SPDX SBOM
        run: go run ./cmd/skil sbom . --output /tmp/skil.spdx.json && jq -e '.spdxVersion == "SPDX-2.3"' /tmp/skil.spdx.json
  vulnerabilities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
          go-package: ./...
  osv-provider:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Prove built-in OSV provider against a known advisory
        shell: bash
        run: |
          set +e
          go run ./cmd/skil scan tests/fixtures/security/osv-known-vulnerability --osv --format json --output osv-proof.json
          code=$?
          set -e
          test "$code" -eq 1
          jq -e '.findings[] | select(.rule_id == "SKIL-DEP-VULN" and (.references | index("GO-2021-0113")))' osv-proof.json
      - uses: actions/upload-artifact@v7
        with:
          name: osv-provider-proof
          path: osv-proof.json
          if-no-files-found: error
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build non-root scanner image
        run: docker build -t skil:ci .
      - name: Smoke test image identity and YARA directory
        shell: bash
        run: |
          docker run --rm skil:ci version
          test "$(docker run --rm --entrypoint id skil:ci -u)" != "0"
          set +e
          docker run --rm -v "$PWD:/scan:ro" skil:ci scan tests/fixtures/security/yara-malware --yara-rules-dir rules
          code=$?
          set -e
          test "$code" -eq 1
  linux-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Linux native isolation
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap util-linux
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Execute Linux bubblewrap integration test
        run: go test ./internal/eval -run TestNativeIsolationExecutesAdapterWhenAvailable -v
        env:
          SKIL_REQUIRE_NATIVE_ISOLATION: "1"
  windows-isolation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Execute Windows AppContainer integration test
        run: go test ./internal/eval -run TestNativeIsolationExecutesAdapterWhenAvailable -v
        env:
          SKIL_REQUIRE_NATIVE_ISOLATION: "1"
  macos-isolation:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Execute macOS sandbox integration test
        run: go test ./internal/eval -run TestNativeIsolationExecutesAdapterWhenAvailable -v
        env:
          SKIL_REQUIRE_NATIVE_ISOLATION: "1"

  assurance-e2e:
    name: Assurance E2E (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            os: linux
            executable_suffix: ""
          - runner: macos-15
            os: macos
            executable_suffix: ""
          - runner: windows-latest
            os: windows
            executable_suffix: ".exe"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Linux native isolation
        if: matrix.os == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap util-linux
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Build scanner and deterministic adapter
        shell: bash
        env:
          EXECUTABLE_SUFFIX: ${{ matrix.executable_suffix }}
        run: |
          mkdir -p dist-e2e
          go build -trimpath -o "dist-e2e/skil${EXECUTABLE_SUFFIX}" ./cmd/skil
          go build -trimpath -o "dist-e2e/assurance-adapter${EXECUTABLE_SUFFIX}" ./internal/evaltestadapter/cmd
      - name: Execute digest-bound CLI assurance gate
        shell: bash
        env:
          EXECUTABLE_SUFFIX: ${{ matrix.executable_suffix }}
          ASSURANCE_PROOF: assurance-${{ matrix.os }}.json
        run: |
          set +e
          "dist-e2e/skil${EXECUTABLE_SUFFIX}" assure tests/fixtures/goal-boundary-containment \
            --runtime-command "dist-e2e/assurance-adapter${EXECUTABLE_SUFFIX}" \
            --format json --output "${ASSURANCE_PROOF}"
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            jq '{
              status,
              scan_status: .scan.status,
              verification_status: .verification.status,
              evaluation_status: .evaluation.status,
              coverage: .evaluation.coverage,
              violations: [.evaluation.runs[]?.violations[]?],
              runtime_errors: [.evaluation.runs[]?.trace.errors[]?]
            }' "${ASSURANCE_PROOF}"
            exit "$code"
          fi
          grep -q '"runtime_enforcement": true' "${ASSURANCE_PROOF}"
          grep -q '"containment": "completed"' "${ASSURANCE_PROOF}"
          grep -q '"native_isolation": "completed"' "${ASSURANCE_PROOF}"
      - uses: actions/upload-artifact@v7
        with:
          name: assurance-${{ matrix.os }}-proof
          path: assurance-${{ matrix.os }}.json
          if-no-files-found: error

  network-gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Exercise bounded public HTTPS gateway
        env:
          SKIL_TEST_NETWORK_GATEWAY_URL: https://example.com/
        run: go test ./internal/eval -run TestNetworkGetToolPublicHTTPSIntegration -count=1 -v

  action-self-test:
    # Exercises action.yml exactly as an external consumer would (uses:
    # ./ resolves the composite action from this checkout), on all three
    # platforms the action claims to support. There is no other way to
    # validate a composite action's actual runtime behavior — it is not
    # Go code, so go test/go vet never touch it.
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Run the action against a clean fixture
        id: clean
        uses: ./
        with:
          path: tests/fixtures/clean-skill
          version: v0.2.0
          upload-sarif: 'false'
          fail-on-findings: 'false'
          sarif-file: clean.sarif
      - name: Assert the clean fixture passed with a well-formed SARIF report
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.clean.outputs.exit-code }}" = "0"
          jq -e '.runs' clean.sarif >/dev/null
      - name: Run the action against a malicious fixture
        id: malicious
        uses: ./
        with:
          path: tests/fixtures/malicious-skill
          version: v0.2.0
          upload-sarif: 'false'
          fail-on-findings: 'false'
          sarif-file: malicious.sarif
      - name: Assert the malicious fixture failed the gate with non-empty SARIF results
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.malicious.outputs.exit-code }}" = "1"
          test "$(jq '.runs[0].results | length' malicious.sarif)" -gt 0
      - name: Assert fail-on-findings actually fails the step
        uses: ./
        continue-on-error: true
        id: enforced
        with:
          path: tests/fixtures/malicious-skill
          version: v0.2.0
          upload-sarif: 'false'
          fail-on-findings: 'true'
          sarif-file: enforced.sarif
      - name: Verify the enforced step reported failure
        shell: bash
        run: test "${{ steps.enforced.outcome }}" = "failure"
