name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true
      - run: gofmt -l cmd internal pkg | tee /tmp/gofmt && test ! -s /tmp/gofmt
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - run: go build -trimpath ./cmd/skil
      - name: Install YARA
        run: sudo apt-get update && sudo apt-get install -y yara
      - run: go run ./cmd/skil validate tests/fixtures/clean-skill
      - run: go run ./cmd/skil scan tests/fixtures/clean-skill --format sarif --output skil.sarif
      - run: go run ./cmd/skil policy check tests/fixtures/example --policy examples/policy.yaml
      - name: Verify YARA security gate
        run: |
          set +e
          go run ./cmd/skil scan tests/fixtures/security/yara-malware --yara-rules rules/malware.yar
          code=$?
          set -e
          test "$code" -eq 1
      - name: Validate JSON schemas
        run: for schema in schemas/*.json; do jq empty "$schema"; done
