name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-latest
            os: linux
            arch: amd64
            binary: skil
            executable_suffix: ""
          - runner: macos-15
            os: darwin
            arch: arm64
            binary: skil
            executable_suffix: ""
          - runner: windows-latest
            os: windows
            arch: amd64
            binary: skil.exe
            executable_suffix: ".exe"
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify and test source
        run: go mod verify && go test ./...
      - name: Install Linux native isolation
        if: matrix.os == 'linux'
        shell: bash
        # The sysctl reset matches ci.yml's assurance-e2e job: recent
        # Ubuntu 24.04 runner images restrict unprivileged user namespace
        # creation via AppArmor by default, which makes bubblewrap fail
        # with "No permissions to create new namespace" even though
        # bubblewrap itself installed fine. Without this, the release
        # assurance gate below fails on every run.
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap util-linux
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Build release assurance adapter
        shell: bash
        env:
          EXECUTABLE_SUFFIX: ${{ matrix.executable_suffix }}
        run: |
          mkdir -p .release-gate
          go build -trimpath -o ".release-gate/assurance-adapter${EXECUTABLE_SUFFIX}" ./internal/evaltestadapter/cmd
      - name: Execute native release assurance gate
        shell: bash
        env:
          EXECUTABLE_SUFFIX: ${{ matrix.executable_suffix }}
        run: |
          set +e
          go run ./cmd/skil assure tests/fixtures/goal-boundary-containment \
            --runtime-command ".release-gate/assurance-adapter${EXECUTABLE_SUFFIX}" \
            --format json --output .release-gate/assurance.json
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            # go run's own error ("exit status N") carries no detail about
            # *why* the gate failed, so surface the assurance report's
            # verdict fields directly on failure.
            jq '{
              status,
              scan_status: .scan.status,
              verification_status: .verification.status,
              evaluation_status: .evaluation.status,
              coverage: .evaluation.coverage,
              violations: [.evaluation.runs[]?.violations[]?],
              runtime_errors: [.evaluation.runs[]?.trace.errors[]?]
            }' .release-gate/assurance.json
            exit "$code"
          fi
          grep -q '"runtime_enforcement": true' .release-gate/assurance.json
          grep -q '"containment": "completed"' .release-gate/assurance.json
          grep -q '"native_isolation": "completed"' .release-gate/assurance.json
      - name: Build native binary
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          RELEASE_OS: ${{ matrix.os }}
          RELEASE_ARCH: ${{ matrix.arch }}
          RELEASE_BINARY: ${{ matrix.binary }}
        run: |
          version="${RELEASE_VERSION#v}"
          mkdir -p dist/package
          go build -trimpath -ldflags "-s -w -X github.com/domehahn/skil/pkg/skil.Version=${version}" -o "dist/package/${RELEASE_BINARY}" ./cmd/skil
          "dist/package/${RELEASE_BINARY}" sbom "dist/package/${RELEASE_BINARY}" --output "dist/skil_${RELEASE_VERSION}_${RELEASE_OS}_${RELEASE_ARCH}.spdx.json"
          cp LICENSE THIRD_PARTY_NOTICES.md dist/package/
          tar -C dist/package -czf "dist/skil_${RELEASE_VERSION}_${RELEASE_OS}_${RELEASE_ARCH}.tar.gz" "${RELEASE_BINARY}" LICENSE THIRD_PARTY_NOTICES.md
      - name: Attest build provenance
        id: provenance
        uses: actions/attest@v4.2.2
        with:
          subject-path: dist/skil_${{ github.ref_name }}_${{ matrix.os }}_${{ matrix.arch }}.tar.gz
      - name: Attest archive SBOM
        id: sbom-attestation
        uses: actions/attest@v4.2.2
        with:
          subject-path: dist/skil_${{ github.ref_name }}_${{ matrix.os }}_${{ matrix.arch }}.tar.gz
          sbom-path: dist/skil_${{ github.ref_name }}_${{ matrix.os }}_${{ matrix.arch }}.spdx.json
      - name: Verify exact provenance and SBOM bundles
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbom-attestation.outputs.bundle-path }}
        run: |
          archive="dist/skil_${GITHUB_REF_NAME}_${{ matrix.os }}_${{ matrix.arch }}.tar.gz"
          common=(--repo "${GITHUB_REPOSITORY}" --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release.yml" --source-ref "${GITHUB_REF}" --deny-self-hosted-runners)
          gh attestation verify "$archive" --bundle "$PROVENANCE_BUNDLE" "${common[@]}"
          gh attestation verify "$archive" --bundle "$SBOM_BUNDLE" \
            --predicate-type https://spdx.dev/Document/v2.3 "${common[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: skil-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.spdx.json
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # gh release create --generate-notes needs a local git checkout to
      # walk commit history against; this job otherwise only downloads
      # artifacts, so without this step it fails with "fatal: not a git
      # repository".
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: skil-*
          path: release
          merge-multiple: true
      - name: Verify downloaded build attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for archive in release/*.tar.gz; do
            common=(--repo "${GITHUB_REPOSITORY}" --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release.yml" --source-ref "${GITHUB_REF}" --deny-self-hosted-runners)
            gh attestation verify "$archive" "${common[@]}"
            gh attestation verify "$archive" --predicate-type https://spdx.dev/Document/v2.3 "${common[@]}"
          done
      - name: Create checksums
        working-directory: release
        run: |
          sha256sum *.tar.gz *.spdx.json > checksums.txt
          sha256sum -c checksums.txt
      - name: Attest release checksums
        id: checksum-attestation
        uses: actions/attest@v4.2.2
        with:
          subject-checksums: release/checksums.txt
      - name: Verify exact checksum-backed attestation bundle
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKSUM_BUNDLE: ${{ steps.checksum-attestation.outputs.bundle-path }}
        run: |
          for artifact in release/*.tar.gz release/*.spdx.json; do
            gh attestation verify "$artifact" --bundle "$CHECKSUM_BUNDLE" \
              --repo "${GITHUB_REPOSITORY}" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release.yml" \
              --source-ref "${GITHUB_REF}" \
              --deny-self-hosted-runners
          done
      - name: Publish immutable tag assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release/* --verify-tag --generate-notes || gh release upload "${GITHUB_REF_NAME}" release/* --clobber
