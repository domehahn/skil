- id: ASP-02.08
  name: Planner Selection Integrity
  domain_id: ASP-02
  domain: Discovery, Metadata & Selection Integrity
  invariant: Der Planner darf Skills nur anhand verifizierter Metadaten, Capabilities und Vertrauenssignale auswählen; Fake
    Recommendations und Permission Deception dürfen die Auswahl nicht dominieren.
  detection: Metadata sanitization, planner adversarial tests, permission consistency, trust-aware reranking.
  minimum_evidence: Candidate set, Planner-Entscheidung und manipulierendes Metadatum.
  owasp_agentic:
  - ASI01
  - ASI04
  - ASI09
  owasp_llm:
  - LLM01
  - LLM03
  - LLM06
  - LLM09
  mitre_atlas:
  - AI Supply Chain Reputation Inflation
  - AI Supply Chain Rug Pull
  - Prompt Infiltration via Public-Facing Application
  skil_controls:
  - SKIL-INTENT-DESCRIPTION
  - SKIL-CAP-DECLARATION-MISSING
  skil_status: PARTIAL
  fixtures:
  - fixture: under-declared-capability
    description: Code capability detected but not covered by declared permissions
    skil_rules: &id025
    - SKIL-CAP-DECLARATION-MISSING
    external_rule: LP1
    external_rules: &id026
    - LP1
    suite: static
    status: DIFFERENT_BY_DESIGN
    notes: skil requires explicit reviewed contract (skil verify); reference scanner infers heuristically.
  - fixture: no-permissions-declared
    description: No permissions/allowed-tools field but code capabilities exist
    skil_rules: &id027
    - SKIL-CAP-DECLARATION-MISSING
    external_rule: LP3
    external_rules: &id028
    - LP3
    suite: static
    status: FULL
    notes: Documented FULL in crosswalk.
  - fixture: over-declared-permission
    description: Declared permission has no corresponding code capability
    skil_rules: &id029
    - SKIL-CAP-DECLARATION-MISSING
    external_rule: LP4
    external_rules: &id030
    - LP4
    suite: static
    status: DIFFERENT_BY_DESIGN
    notes: Category-level over-declaration covered. Per-item allowlist over-declaration not covered.
    status_note: 'Declared-but-unused permissions are a verification-layer signal: skil verify enforces contract-scoped permission
      usage against an explicit reviewed contract, and per-item allowlist over-declaration cannot be inferred statically without
      reproducing false positives on legitimately unused-but-declared entries. The reference scanner''s static reverse-mapping
      heuristic is deliberately not reproduced.'
  - fixture: llm-description-behavior-mismatch
    description: LLM compares manifest description/triggers/permissions vs code
    skil_rules: *id001
    external_rule: TP4
    external_rules: *id002
    suite: semantic
