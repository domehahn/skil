    status: FULL
    notes: Provider-backed; verified in semantic suite.
- id: ASP-02.01
  name: Metadata Authenticity
  domain_id: ASP-02
  domain: Discovery, Metadata & Selection Integrity
  invariant: Name, Beschreibung, Eigentümer-, Herkunfts- und Vertrauensmetadaten müssen nachweisbar zum tatsächlich geladenen
