  invariant: Der effektive Skill-Auftrag und daraus abgeleitete Subziele müssen innerhalb des autorisierten Scopes bleiben.
  detection: Contract-vs-Behavior-Diff, semantische Goal-Relation und Runtime-Capability-Checks.
  minimum_evidence: declared_goal, effective_goal, zusätzliche Operation und fehlende Autorisierung.
  owasp_agentic:
  - ASI01
  - ASI09
  - ASI10
  owasp_llm:
  - LLM01
  - LLM06
  - LLM07
  mitre_atlas:
  - LLM Prompt Injection
  - LLM Jailbreak
  - AI Agent Context Poisoning
  - Modify AI Agent Configuration
  skil_controls:
  - SKIL-INTENT-SCOPE
  skil_status: PARTIAL
  fixtures:
  - fixture: scope-creep
    description: NL instructions requesting scope expansion beyond stated purpose
    skil_rules:
    - SKIL-INTENT-SCOPE-CREEP
    external_rule: EA3
    external_rules:
    - EA3
    suite: static
    status: FULL
    notes: Covers extend-scope, general-purpose, act-as-omniscient requests.
  - fixture: scope-creep-permissions
    description: LLM compares code behavior against declared permissions
    skil_rules:
    - SKIL-INTENT-SCOPE
    external_rule: SDI-3
    external_rules:
    - SDI-3
