schema_version: 2.0.0
source_specification: ASPS v1.0
registry: ../asps/asps-registry.json
properties:
- id: ASP-01.01
  name: Instruction Hierarchy Preservation
  domain_id: ASP-01
  domain: Instruction & Goal Integrity
  invariant: Höher priorisierte System-, Developer- und Policy-Instruktionen dürfen durch Skill-Inhalte weder explizit noch
    semantisch überschrieben, entwertet oder ersetzt werden.
  detection: Pattern-/Intent-Analyse mit Negationsscope; semantische Residualanalyse; Runtime-Policy.
  minimum_evidence: Override-Operation, Target, Modalität, Scope und Kontext.
  owasp_agentic:
  - ASI01
  - ASI09
  - ASI10
  owasp_llm:
  - LLM01
  - LLM06
  - LLM07
  mitre_atlas:
  - LLM Prompt Injection
  - LLM Jailbreak
  - AI Agent Context Poisoning
  - Modify AI Agent Configuration
  skil_controls:
  - SKIL-PI-001
  skil_status: IMPLEMENTED
  fixtures:
  - fixture: instruction-override
    description: Fabricated instruction attempts to override higher-priority guidance
    skil_rules:
    - SKIL-PI-001
    external_rule: P1
    external_rules:
    - P1
    suite: static
    status: FULL
    notes: Contextual negative examples are tested.
- id: ASP-01.02
  name: Role & Context Integrity
  domain_id: ASP-01
  domain: Instruction & Goal Integrity
  invariant: Ein Skill darf weder eine privilegiertere Rolle vortäuschen noch untrusted Inhalt in einen höher vertrauenswürdigen
    Kontext umklassifizieren.
  detection: Rollen-/Kontext-Token-Erkennung, semantische Rollenrelation, Trust-Label-Propagation.
  minimum_evidence: Actor, beanspruchte Rolle, ursprüngliche Trust-Klasse und Kontextwechsel.
  owasp_agentic:
  - ASI01
  - ASI09
  - ASI10
  owasp_llm:
  - LLM01
  - LLM06
  - LLM07
  mitre_atlas:
  - LLM Prompt Injection
  - LLM Jailbreak
  - AI Agent Context Poisoning
  - Modify AI Agent Configuration
  skil_controls:
  - SKIL-PI-002
  - SKIL-PI-003
  skil_status: IMPLEMENTED
  fixtures: []
- id: ASP-01.03
  name: Refusal Preservation
  domain_id: ASP-01
  domain: Instruction & Goal Integrity
  invariant: Ein Skill darf die Fähigkeit des Agenten, unzulässige oder nicht verifizierbare Aktionen abzulehnen, nicht generell
    unterdrücken.
  detection: Intent- und Modalitätsanalyse für REFUSE/COMPLY.
  minimum_evidence: actor=AGENT; action=REFUSE; permission=FORBIDDEN bzw. unconditional compliance.
  owasp_agentic:
  - ASI01
  - ASI09
  - ASI10
  owasp_llm:
  - LLM01
  - LLM06
  - LLM07
  mitre_atlas:
  - LLM Prompt Injection
  - LLM Jailbreak
  - AI Agent Context Poisoning
  - Modify AI Agent Configuration
  skil_controls:
  - SKIL-INTENT-REFUSAL
  skil_status: IMPLEMENTED
  fixtures:
  - fixture: anti-refusal
    description: Instructions demanding unconditional compliance / suppress refusal
    skil_rules:
    - SKIL-INTENT-REFUSAL
    external_rule: AR1
    external_rules:
    - AR1
    suite: static
    status: FULL
    notes: Covers never-refuse, always-comply, comply-mandatory, refusal-prohibited.
- id: ASP-01.04
  name: Warning & Safety-Context Preservation
  domain_id: ASP-01
  domain: Instruction & Goal Integrity
  invariant: Ein Skill darf notwendige Warnungen, Caveats oder sicherheitsrelevante Hinweise nicht pauschal unterdrücken.
  detection: Intent-Analyse für Suppression-Verben und Safety-Objekte.
  minimum_evidence: Suppression-Intent, Safety-Objekt, Scope und Kontext.
  owasp_agentic:
  - ASI01
  - ASI09
  - ASI10
  owasp_llm:
  - LLM01
  - LLM06
  - LLM07
  mitre_atlas:
  - LLM Prompt Injection
  - LLM Jailbreak
  - AI Agent Context Poisoning
  - Modify AI Agent Configuration
  skil_controls:
  - SKIL-INTENT-WARNING
  skil_status: IMPLEMENTED
  fixtures:
  - fixture: disclaimer-suppression
    description: No warnings/don't moralize/skip the ethics instructions
    skil_rules:
    - SKIL-INTENT-WARNING
    external_rule: AR2
    external_rules:
    - AR2
    suite: static
    status: FULL
    notes: Suppresses false positives from detect/reject X meta-discussion.
- id: ASP-01.05
  name: Guardrail Integrity
  domain_id: ASP-01
  domain: Instruction & Goal Integrity
  invariant: Ein Skill darf Sicherheitsrichtlinien, Guardrails oder Policy-Enforcement nicht als unwirksam, optional oder
    deaktivierbar deklarieren.
  detection: Guardrail-Nullification-Patterns plus semantische Policy-Relation.
  minimum_evidence: Guardrail/Policy als Target, Nullification-Operation und Reichweite.
  owasp_agentic:
  - ASI01
  - ASI09
  - ASI10
  owasp_llm:
  - LLM01
  - LLM06
  - LLM07
  mitre_atlas:
  - LLM Prompt Injection
  - LLM Jailbreak
  - AI Agent Context Poisoning
  - Modify AI Agent Configuration
  skil_controls:
  - SKIL-INTENT-GUARDRAIL
  - SKIL-GUARDRAIL-I18N-001
  skil_status: IMPLEMENTED
  fixtures:
  - fixture: safety-nullification
    description: You have no restrictions / DAN mode / not bound by policy
    skil_rules:
    - SKIL-INTENT-GUARDRAIL
    external_rule: AR3
    external_rules:
    - AR3
    suite: static
    status: FULL
    notes: Also has SKIL-GUARDRAIL-I18N-001 for CJK phrasing.
- id: ASP-01.06
  name: Hidden Instruction Resistance
  domain_id: ASP-01
  domain: Instruction & Goal Integrity
  invariant: Instruktionen dürfen nicht durch unsichtbare Unicode-Zeichen, Bidi-Steuerung, Kommentar-/Rendering-Differenzen
    oder Darstellungsasymmetrien verborgen werden.
  detection: Unicode-Codepoint-, Bidi-, Markdown/HTML- und Render-vs-Raw-Analyse.
  minimum_evidence: Raw codepoints/markup, versteckte Instruktionsspanne und Render-Differenz.
  owasp_agentic:
  - ASI01
  - ASI09
  - ASI10
  owasp_llm:
  - LLM01
  - LLM06
  - LLM07
  mitre_atlas:
  - LLM Prompt Injection
  - LLM Jailbreak
  - AI Agent Context Poisoning
  - Modify AI Agent Configuration
  skil_controls:
  - SKIL-UNI-001
  - SKIL-UNI-003
  skil_status: PARTIAL
  fixtures:
  - fixture: hidden-instructions-html
    description: HTML comments with injection-bearing content
    skil_rules:
    - SKIL-PI-HIDDEN-COMMENT
    external_rule: P2
    external_rules:
    - P2
    suite: static
    status: FULL
    notes: HTML <!--...--> comments with injection/suspicious content.
    external_variant: html-comment
  - fixture: hidden-instructions-markdown
    description: Markdown hidden comments with injection/suspicious content
    skil_rules:
    - SKIL-PI-MD-HIDDEN-COMMENT
    - SKIL-PI-MD-SUSPICIOUS-COMMENT
    external_rule: P2
    external_rules:
    - P2
    suite: static
    status: FULL
    notes: '[//]: #(...) patterns with injection or suspicious content.'
    external_variant: markdown-comment
  - fixture: unicode-zero-width
    description: Zero-width chars and bidi override characters
    skil_rules: &id065
    - SKIL-UNI-001
    external_rule: P2
    external_rules: &id066
    - P2
    suite: static
    status: FULL
    notes: Zero-width spaces, bidi overrides with emoji-ZWJ carve-out.
    external_variant: zero-width
  - fixture: unicode-tag-smuggling
    description: Unicode Tag block ASCII smuggling with RGI emoji-flag carve-out
    skil_rules:
    - SKIL-UNI-003
    external_rule: P2
    external_rules:
    - P2
    suite: static
    status: FULL
    notes: Invisible U+E0000-E007F tag characters carrying hidden ASCII payload.
    external_variant: unicode-tag
  - fixture: obfuscated-code
    description: exec(base64.b64decode(...)), marshal.loads, decode-then-execute chains
    skil_rules: &id047
    - SKIL-OBF-001
    - SKIL-UNI-001
    - SKIL-UNI-002
    external_rule: SC3
    external_rules: &id048
    - SC3
    suite: static
    status: FULL
    notes: Documented FULL in crosswalk.
  - fixture: unicode-homoglyph
    description: Homoglyph/RTL/invisible/mixed-script in tool name/triggers/parameter names
    skil_rules: &id067
    - SKIL-UNI-002
    - SKIL-UNI-001
    external_rule: TP2
    external_rules: &id068
    - TP2
    suite: static
    status: FULL
    notes: Confusable hostname tokens, bidi overrides, invisible chars in identifiers.
- id: ASP-01.07
  name: Covert Behavioral Steering Resistance
  domain_id: ASP-01
  domain: Instruction & Goal Integrity
  invariant: Ein Skill darf Nutzer- oder Agentenentscheidungen nicht verdeckt zugunsten fremder Ziele oder Sicherheitsabsenkungen
    steuern.
  detection: Intent-Analyse für biased recommendation, concealment, trust-then-exploit und safety-deprioritization.
  minimum_evidence: Steering-Ziel, Begünstigter und manipulierte Entscheidung.
  owasp_agentic:
  - ASI01
  - ASI09
  - ASI10
  owasp_llm:
  - LLM01
  - LLM06
  - LLM07
  mitre_atlas:
  - LLM Prompt Injection
  - LLM Jailbreak
  - AI Agent Context Poisoning
  - Modify AI Agent Configuration
  skil_controls:
  - SKIL-INTENT-BEHAVIOR-MANIPULATION
  skil_status: IMPLEMENTED
  fixtures:
  - fixture: behavior-manipulation
    description: Covert behavioral steering / dark-pattern influence on the user
    skil_rules: &id077
    - SKIL-INTENT-BEHAVIOR-MANIPULATION
    external_rule: P4
    external_rules: &id078
    - P4
    suite: static
    status: FULL
    notes: Covers biased recommendation steering, silent suppression, trust-then-exploit patterns.
- id: ASP-01.08
  name: Goal & Scope Integrity
  domain_id: ASP-01
