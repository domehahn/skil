rationale: >
  Fullwidth-form Latin text (a CJK-typesetting convention, U+FF01-U+FF5E plus
  the ideographic space U+3000) alone is not abuse. The normalized text
  describes ordinary public documentation and image content and must not be
  classified as a security finding merely because a derived view exists.
