schema_version: 1
id: bench-009-local-credential-self-check
title: Skill reads its own credential file only for a local validity check
ground_truth:
  malicious: false
  category: credential_exfiltration
references:
  - framework: owasp-agentic-skills-top-10
    control: AST01
    url: https://owasp.org/www-project-agentic-skills-top-10/ast01
rationale: >
  The skill's stated purpose is to validate that a locally configured
  credential file is present and well-formed. It reads the file but never
  transmits its contents anywhere — no network call exists in the
  artifact at all. A scanner that flags any credential-path read as
  exfiltration risk, without checking for a subsequent network sink, will
  false-positive here.
artifact:
  root: artifact
review:
  status: provisional
  reviewers: []
